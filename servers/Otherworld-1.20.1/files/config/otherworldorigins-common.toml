
["Otherworld Origins Config"]

	["Otherworld Origins Config"."Enchantment Restrictions"]
		# Enable class-based enchantment restrictions
		enableEnchantmentRestrictions = true

	["Otherworld Origins Config"."Durability Rework"]
		#Enable Durability Rework
		enableDurabilityRework = true

	["Otherworld Origins Config"."Starter Kit"]
		# Items given to players when they confirm their character creation.
		# Format: "item_id|count|nbt" where:
		#   - item_id: The item resource location (e.g., minecraft:iron_sword)
		#   - count: The number of items (e.g., 1)
		#   - nbt: Optional NBT data as JSON string (can be empty, e.g., {} or leave empty)
		# Example: "minecraft:iron_sword|1|" or "minecraft:enchanted_book|1|{\"StoredEnchantments\":[{\"id\":\"minecraft:sharpness\",\"lvl\":1}]}"
		# List of starter kit items in format: item_id|count|nbt
		starter_kit_items = ["ftbquests:book|1|", "minecraft:torch|4|", "legendarysurvivaloverhaul:bandage|6|"]
		# Extra items for players who finished character creation with a specific class origin
		# on layer otherworldorigins:class (checked on server when they confirm the final screen).
		# Format: "class_origin_id|item_id|count|nbt" where:
		#   - class_origin_id: Full origin ID on the class layer (e.g. otherworldorigins:class/bard)
		#   - item_id, count, nbt: Same as starter_kit_items (nbt optional)
		# Per-class starter kit rows: class_origin_id|item_id|count|nbt
		class_starter_kit_entries = ["otherworldorigins:class/artificer|minecraft:iron_pickaxe|1|", "otherworldorigins:class/barbarian|minecraft:stone_axe|1|", "otherworldorigins:class/bard|immersive_melodies:lute|1|", "otherworldorigins:class/cleric|minecraft:book|1|", "otherworldorigins:class/druid|minecraft:wooden_hoe|1|", "otherworldorigins:class/fighter|minecraft:iron_sword|1|", "otherworldorigins:class/monk|minecraft:stick|1|", "otherworldorigins:class/paladin|minecraft:shield|1|", "otherworldorigins:class/ranger|minecraft:bow|1|", "otherworldorigins:class/rogue|minecraft:crossbow|1|", "otherworldorigins:class/sorcerer|minecraft:blaze_powder|1|", "otherworldorigins:class/warlock|minecraft:ender_pearl|1|", "otherworldorigins:class/wizard|minecraft:writable_book|1|"]

	["Otherworld Origins Config"."Shoulder Surfing Integration"]
		# Powers that should NOT trigger player rotation toward the crosshair when activated.
		# If ALL powers being activated match the blacklist, rotation is skipped.
		# Supports wildcards: * matches any characters.
		# Examples:
		#   - "origins:*" matches all powers from the origins namespace
		#   - "*toggle*" matches any power containing 'toggle'
		#   - "otherworldorigins:some_power" matches exactly that power
		# List of power patterns to exclude from shoulder surfing rotation
		rotation_blacklist = ["otherworldorigins:dark_vision_toggle", "otherworldorigins:cantrips/fortify", "otherworldorigins:cantrips/two/fortify", "otherworldorigins:cantrips/oakskin", "otherworldorigins:cantrips/two/oakskin", "otherworldorigins:cantrips/healing_circle", "otherworldorigins:cantrips/two/healing_circle", "otherworldorigins:cantrips/magical_secrets/fortify", "otherworldorigins:cantrips/magical_secrets/oakskin", "otherworldorigins:cantrips/magical_secrets/healing_circle", "otherworldorigins:class/druid/wildshape_enter_wildshape"]

